<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Elite Events - Professional Event Management Services">
    <title>Contact - Elite Events</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background Orbs */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            opacity: 0.15;
            filter: blur(50px);
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        .orb-1 {
            width: 350px;
            height: 350px;
            background: #ff006e;
            top: -120px;
            left: -80px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: #00d9ff;
            bottom: -80px;
            right: -50px;
            animation-delay: 2.5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            width: 100%;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 8vw, 3.5rem);
            font-weight: 800;
            background: linear-gradient(135deg, #ff006e, #00d9ff, #39ff14);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            line-height: 1.2;
            letter-spacing: -1px;
        }

        .tagline {
            font-size: clamp(1rem, 2vw, 1.15rem);
            color: #00d9ff;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Contact Grid */
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .contact-card {
            position: relative;
            background: rgba(26, 26, 46, 0.3);
            backdrop-filter: blur(12px);
            border: 2px solid #ff006e;
            border-radius: 20px;
            padding: 24px 16px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 160px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.2);
        }

        .contact-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 0, 110, 0.2), rgba(0, 217, 255, 0.2));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .contact-card:hover {
            transform: translateY(-12px);
            border-color: #00d9ff;
            background: rgba(26, 26, 46, 0.6);
            box-shadow: 0 0 40px rgba(255, 0, 110, 0.6), 0 0 60px rgba(0, 217, 255, 0.4);
        }

        .contact-card:hover::before {
            opacity: 1;
        }

        .contact-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ff006e 0%, #00d9ff 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 12px;
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.5);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .contact-card:hover .contact-icon {
            transform: scale(1.15) rotate(8deg);
            box-shadow: 0 0 40px rgba(255, 0, 110, 0.8), 0 0 60px rgba(0, 217, 255, 0.5);
        }

        .contact-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .contact-text {
            font-size: 0.85rem;
            color: #39ff14;
            font-weight: 600;
        }

        /* Platform Specific Colors */
        .whatsapp { border-color: #25d366; }
        .whatsapp:hover {
            border-color: #25d366;
            box-shadow: 0 0 40px rgba(37, 211, 102, 0.6), 0 0 60px rgba(37, 211, 102, 0.3);
        }
        .whatsapp:hover .contact-icon { background: linear-gradient(135deg, #25d366, #20ba5a); }

        .website { border-color: #00d9ff; }
        .website:hover {
            border-color: #00d9ff;
            box-shadow: 0 0 40px rgba(0, 217, 255, 0.6), 0 0 60px rgba(0, 217, 255, 0.4);
        }
        .website:hover .contact-icon { background: linear-gradient(135deg, #00d9ff, #00b8b8); }

        .instagram { border-color: #e4405f; }
        .instagram:hover {
            border-color: #e4405f;
            box-shadow: 0 0 40px rgba(228, 64, 95, 0.6), 0 0 60px rgba(228, 64, 95, 0.3);
        }
        .instagram:hover .contact-icon { background: linear-gradient(135deg, #e4405f, #fd1d1d); }

        .facebook { border-color: #1877f2; }
        .facebook:hover {
            border-color: #1877f2;
            box-shadow: 0 0 40px rgba(24, 119, 242, 0.6), 0 0 60px rgba(24, 119, 242, 0.3);
        }
        .facebook:hover .contact-icon { background: linear-gradient(135deg, #1877f2, #0a66c2); }

        .youtube { border-color: #ff0000; }
        .youtube:hover {
            border-color: #ff0000;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.6), 0 0 60px rgba(255, 0, 0, 0.3);
        }
        .youtube:hover .contact-icon { background: linear-gradient(135deg, #ff0000, #cc0000); }

        .linkedin { border-color: #0a66c2; }
        .linkedin:hover {
            border-color: #0a66c2;
            box-shadow: 0 0 40px rgba(10, 102, 194, 0.6), 0 0 60px rgba(10, 102, 194, 0.3);
        }
        .linkedin:hover .contact-icon { background: linear-gradient(135deg, #0a66c2, #004182); }

        .gmail { border-color: #ea4335; }
        .gmail:hover {
            border-color: #ea4335;
            box-shadow: 0 0 40px rgba(234, 67, 53, 0.6), 0 0 60px rgba(234, 67, 53, 0.3);
        }
        .gmail:hover .contact-icon { background: linear-gradient(135deg, #ea4335, #c5221f); }

        .x-social { border-color: #000000; }
        .x-social:hover {
            border-color: #ffffff;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.3);
        }
        .x-social:hover .contact-icon { background: linear-gradient(135deg, #000000, #333333); }

        /* Responsive Design */
        @media (max-width: 768px) {
            .contact-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 15px;
            }

            .contact-card {
                padding: 18px 12px;
                min-height: 140px;
                border-radius: 16px;
            }

            .contact-icon {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }

            .contact-name {
                font-size: 0.95rem;
            }

            .contact-text {
                font-size: 0.8rem;
            }

            h1 {
                font-size: 2.5rem;
            }

            .header {
                margin-bottom: 35px;
            }
        }

        @media (max-width: 600px) {
            .contact-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .contact-card {
                padding: 15px 10px;
                min-height: 130px;
                border-radius: 14px;
            }

            .contact-icon {
                width: 40px;
                height: 40px;
                font-size: 18px;
                margin-bottom: 8px;
            }

            .contact-name {
                font-size: 0.9rem;
            }

            .contact-text {
                font-size: 0.75rem;
            }

            h1 {
                font-size: 2rem;
            }

            .tagline {
                font-size: 0.9rem;
            }

            .header {
                margin-bottom: 25px;
            }

            .container {
                max-width: 100%;
            }
        }

        /* Accessibility */
        .contact-card:focus {
            outline: 2px solid #00d9ff;
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Background Orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Let's Create Magic</h1>
            <p class="tagline">CONNECT WITH US FOR YOUR NEXT EVENT</p>
        </div>

        <!-- Contact Grid -->
        <div class="contact-grid">
            <!-- WhatsApp -->
            <a href="https://wa.me/919999999999" target="_blank" rel="noopener noreferrer" class="contact-card whatsapp" title="Chat on WhatsApp">
                <div class="contact-icon">💬</div>
                <div class="contact-name">WhatsApp</div>
                <div class="contact-text">Chat</div>
            </a>

            <!-- Website -->
            <a href="https://www.example.com" target="_blank" rel="noopener noreferrer" class="contact-card website" title="Visit Website">
                <div class="contact-icon">🌐</div>
                <div class="contact-name">Website</div>
                <div class="contact-text">Visit</div>
            </a>

            <!-- Instagram -->
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="contact-card instagram" title="Follow on Instagram">
                <div class="contact-icon">📸</div>
                <div class="contact-name">Instagram</div>
                <div class="contact-text">Follow</div>
            </a>

            <!-- Facebook -->
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="contact-card facebook" title="Like on Facebook">
                <div class="contact-icon">f</div>
                <div class="contact-name">Facebook</div>
                <div class="contact-text">Like</div>
            </a>

            <!-- YouTube -->
            <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="contact-card youtube" title="Subscribe on YouTube">
                <div class="contact-icon">▶️</div>
                <div class="contact-name">YouTube</div>
                <div class="contact-text">Subscribe</div>
            </a>

            <!-- LinkedIn -->
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="contact-card linkedin" title="Connect on LinkedIn">
                <div class="contact-icon">💼</div>
                <div class="contact-name">LinkedIn</div>
                <div class="contact-text">Connect</div>
            </a>

            <!-- Gmail -->
            <a href="mailto:hello@elite.com" class="contact-card gmail" title="Send Email">
                <div class="contact-icon">✉️</div>
                <div class="contact-name">Gmail</div>
                <div class="contact-text">Email</div>
            </a>

            <!-- X / Twitter -->
            <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" class="contact-card x-social" title="Follow on X">
                <div class="contact-icon">𝕏</div>
                <div class="contact-name">X</div>
                <div class="contact-text">Follow</div>
            </a>
        </div>
    </div>

</body>
</html>
