<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Event Management Company</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Montserrat:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background elements */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            filter: blur(50px);
            animation: float 8s ease-in-out infinite;
        }

        .orb-1 {
            width: 350px;
            height: 350px;
            background: #ff006e;
            top: -120px;
            left: -80px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: #00d9ff;
            bottom: -80px;
            right: -50px;
            animation-delay: 2.5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        .container {
            max-width: 600px;
            width: 90%;
            z-index: 10;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ff006e, #00d9ff, #39ff14);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 1.15rem;
            color: #00d9ff;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .contacts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .contact-card {
            position: relative;
            background: rgba(26, 26, 46, 0.3);
            backdrop-filter: blur(12px);
            border: 2px solid #ff006e;
            border-radius: 20px;
            padding: 28px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 160px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.2), inset 0 0 20px rgba(0, 217, 255, 0.1);
        }

        .contact-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 0, 110, 0.2), rgba(0, 217, 255, 0.2));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .contact-card:hover {
            transform: translateY(-12px);
            border-color: #00d9ff;
            background: rgba(26, 26, 46, 0.6);
            box-shadow: 0 0 40px rgba(255, 0, 110, 0.6), 0 0 60px rgba(0, 217, 255, 0.4), inset 0 0 30px rgba(57, 255, 20, 0.1);
        }

        .contact-card:hover::before {
            opacity: 1;
        }

        .icon {
            width: 56px;
            height: 56px;
            margin-bottom: 14px;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff006e 0%, #00d9ff 100%);
            border-radius: 14px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.5);
        }

        .contact-card:hover .icon {
            transform: scale(1.15) rotate(8deg);
            box-shadow: 0 0 40px rgba(255, 0, 110, 0.8), 0 0 60px rgba(0, 217, 255, 0.5);
        }

        .contact-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .contact-text {
            font-size: 0.9rem;
            color: #39ff14;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }

            .contacts-grid {
                grid-template-columns: 1fr;
            }

            .header {
                margin-bottom: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="container">
        <div class="header">
            <h1>Let's Create Magic</h1>
            <p class="subtitle">CONNECT WITH US FOR YOUR NEXT EVENT</p>
        </div>

        <div class="contacts-grid">
            <a href="https://instagram.com" target="_blank" class="contact-card" title="Follow on Instagram">
                <div class="icon">📸</div>
                <div class="contact-name">Instagram</div>
                <div class="contact-text">@yourhandle</div>
            </a>

            <a href="https://facebook.com" target="_blank" class="contact-card" title="Connect on Facebook">
                <div class="icon">f</div>
                <div class="contact-name">Facebook</div>
                <div class="contact-text">Your Profile</div>
            </a>

            <a href="https://wa.me/your-number" target="_blank" class="contact-card" title="Message on WhatsApp">
                <div class="icon">💬</div>
                <div class="contact-name">WhatsApp</div>
                <div class="contact-text">Chat Now</div>
            </a>

            <a href="https://twitter.com" target="_blank" class="contact-card" title="Follow on X">
                <div class="icon">𝕏</div>
                <div class="contact-name">X</div>
                <div class="contact-text">@yourhandle</div>
            </a>

            <a href="https://linkedin.com" target="_blank" class="contact-card" title="Connect on LinkedIn">
                <div class="icon">💼</div>
                <div class="contact-name">LinkedIn</div>
                <div class="contact-text">Your Profile</div>
            </a>

            <a href="mailto:your-email@gmail.com" class="contact-card" title="Send Email">
                <div class="icon">✉️</div>
                <div class="contact-name">Gmail</div>
                <div class="contact-text">your-email</div>
            </a>

            <a href="https://youtube.com" target="_blank" class="contact-card" title="Subscribe on YouTube">
                <div class="icon">▶️</div>
                <div class="contact-name">YouTube</div>
                <div class="contact-text">Subscribe</div>
            </a>
        </div>
    </div>
</body>
</html>
